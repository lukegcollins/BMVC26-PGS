  test_batch_size: 96
  workers: 16
  frame_num_train: 32
  frame_num_val: 32
  frame_num_test: 32
  resolution: 224
  with_mask: false
  with_landmark: false
  use_data_augmentation: true
  lmdb: false
  scan_mode: balanced
  max_frames_per_video: 50
  label_mapping_file: configs/datasets/labels/label_mappings_visual.yaml
  label_type: Binary
  train_temporal_datasets: []
  gpu_normalize: false
  use_video_grouped_sampler: false
  gsd_num_videos_per_batch: 8
  gsd_frames_per_video: 4
  temporal:
    sequence_length: 1
    temporal_stride: 1
    window_step: 8
    max_sequences_per_video: 10
    pairing_mode: strict
    sync_augmentations: true
    sync_threshold: 5
    aggregation_method: mean
    aggregation_threshold: 0.5
training:
  start_epoch: 0
  num_epochs: 25
  seed: 1729
  grad_accum_steps: 4
  grad_clip: 2.0
  nan_check_frequency: 500
  max_nan_tolerance: 5
  use_amp: true
  use_compile: true
  compile_mode: default
  cudnn_benchmark: true
  deterministic: false
  ddp: false
  local_rank: 0
optimizer:
  type: adam
  lr: 5.0e-05
  weight_decay: 0.0001
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  amsgrad: false
  momentum: 0.9
  nesterov: false
  extra:
    lr: 5.0e-05
    weight_decay: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
    backbone_lr_multiplier: 1.0
scheduler:
  type: warmup_cosine_cyclic
  warmup_epochs: 1
  cycle_epochs: 25
  cycles: 1
  lr_base: 5.0e-05
  lr_max: 5.0e-05
  lr_min: 1.0e-06
  extra: {}
checkpoint:
  metric: video_auc
  aggregation: macro
  save_per_dataset: true
  save_average: true
  save_legacy: false
  save_last: true
  save_top_k: 3
augmentations:
  training:
  - name: Resize
    params:
      height: 224
      width: 224
      p: 1.0
  - name: HorizontalFlip
    params:
      p: 0.5
  - name: Affine
    params:
      translate_percent:
      - -0.2
      - 0.2
      scale:
      - 0.8
      - 1.2
      rotate:
      - -20
      - 20
      border_mode: 0
      p: 0.5
  - name: GaussianBlur
    params:
      blur_limit:
      - 3
      - 7
      sigma_limit:
      - 0.1
      - 2.0
      p: 0.2
  - name: ImageCompression
    params:
      quality_range:
      - 30
      - 90
      p: 0.4
  - name: CoarseDropout
    params:
      num_holes_range:
      - 1
      - 2
      hole_height_range:
      - 1
      - 24
      hole_width_range:
      - 1
      - 24
      p: 0.25
  - name: Normalize
    params:
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
  - name: ToTensorV2
  validation:
  - name: Resize
    params:
      height: 224
      width: 224
      p: 1.0
  - name: Normalize
    params:
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
  - name: ToTensorV2
  testing: null
auto_test:
  enabled: false
  checkpoint: best
  test_after_epoch: null
  frame_num: null
loss_type: orthoflow_gtl_gsd
save_ckpt: true
save_feat: true
metric_scoring: video_auc

model_name: orthoflow
task_target: orthoflow_gtl_ln_s1729
log_dir: ./training/logs
backbone_name: dinov3
backbone:
  name: dinov3_vitl16
  weights_dir: ./pretrained/dinov3
  freeze_mode: layernorm
  l2_normalize: true
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  force_fp32: false
  lora: null
  extra:
    input_already_normalized: true
    allow_timm_fallback: false
head:
  type: linear
  hidden_dim: 2048
  dropout: 0.0
  num_classes: 2
  extra: {}
loss:
  weighting_mode: static
  alpha: 1.0
  beta: 0.5
  gamma: 1.0
  use_gtl: true
  use_axis_margin: true
  use_residual_uniformity: true
  use_paired_slerp_aug: true
  ce_only_in_eval: true
  debug_log_params: false
  residual_loss: l2
  uniformity_t: 2.0
  axis_margin: 1.5
  residual_uniformity_t: 3.0
  gtl_disc_weight: 1.0
  gtl_small_weight: 0.2
  gtl_hidden_dim: 512
  gtl_output_dim: 256
  use_hard_rr_negatives: true
  slerp_pair_multiplier: 1
  delta: 0.0
  ortho_margin: 0.1
  magnitude_tau: 0.05
  spatial_ratio: 0.5
  extra:
    gsd_delta_concentration: 0.005
    gsd_delta_coherence: 0.005
    gsd_delta_dispersion: 0.002
    gsd_enable_concentration: false
    gsd_enable_coherence: false
    gsd_enable_dispersion: false
    gsd_real_c_dir_threshold: 0.3
    gsd_min_group_size: 2
    gsd_uniformity_t: 2.0
data:

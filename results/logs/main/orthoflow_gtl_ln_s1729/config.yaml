  default_processing_group: 256w_256h_1.3x_32f_insightface
  dataset_type: standard
  train_dataset_type: paired
  val_dataset_type: single
  test_dataset_type: single
  temporal_alignment_mode: index_aligned
  temporal_alignment_tolerance: 2
  train_datasets:
  - name: FaceForensics++
    split: train
    split_ratio: T-V-T
    log_name: FF-DF-C23
    methods:
    - FF-REAL
    - FF-FS_DF
    compression: c23
    processing_group: null
    integrity_checks: true
  - name: FaceForensics++
